[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "inspire-skill"
version = "7.1.4"
description = "CLI for the Inspire training platform: notebook lifecycle, distributed/HPC job submission, SSH tunneling, image and resource ops"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Inspire Platform Team"}
]
keywords = ["inspire", "hpc", "training", "cli", "machine-learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "requests>=2.28.0",
    "urllib3>=2.7.0",
    "idna>=3.15",
    "click>=8.3.3",
    "playwright>=1.57.0",
    "matplotlib>=3.8.0",
    "pillow>=12.3.0",
    "tomli>=1.2.0; python_version < '3.11'",
]

[project.scripts]
inspire = "inspire.cli.main:cli"

[project.urls]
Documentation = "https://github.com/realZillionX/InspireSkill"
Repository = "https://github.com/realZillionX/InspireSkill"

[tool.setuptools]
packages = {find = {where = ["."], include = ["inspire*"], exclude = ["tests*"]}}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests requiring live API access",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
follow_imports = "silent"
warn_unused_ignores = true
disallow_untyped_defs = false
files = ["inspire"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "ruff>=0.0.280",
    "pre-commit>=3.6.0",
    "mypy>=1.10.0",
]
