name: CI

on:
  pull_request:
    paths:
      - "cli/**"
      - "scripts/**"
      - "examples/agent_ops/**"
      - ".github/workflows/ci.yml"
      - ".pre-commit-config.yaml"
  push:
    branches: [main]
    paths:
      - "cli/**"
      - "scripts/**"
      - "examples/agent_ops/**"
      - ".github/workflows/ci.yml"
      - ".pre-commit-config.yaml"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux (Python 3.10)
            os: ubuntu-latest
            python: "3.10"
            suite: full
          - name: Windows (Python 3.12)
            os: windows-latest
            python: "3.12"
            suite: full
          - name: macOS platform smoke
            os: macos-latest
            python: "3.12"
            suite: platform

    defaults:
      run:
        working-directory: cli

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: cli/uv.lock

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Static checks
        if: runner.os == 'Linux'
        run: |
          uv run ruff check inspire tests ../examples/agent_ops
          uv run mypy

      - name: Unit tests
        if: matrix.suite == 'full'
        run: uv run pytest -q

      - name: macOS filesystem, terminal, subprocess, and installer tests
        if: matrix.suite == 'platform'
        run: >-
          uv run pytest -q
          tests/test_private_local_files.py tests/test_cache_lock.py
          tests/test_terminal_io.py tests/test_interactive_console.py
          tests/test_bridge_exec.py tests/test_bridge_scp.py
          tests/test_native_async_pty.py tests/test_sdk_async_execution.py
          tests/test_installer_script.py tests/test_uninstall_command.py
          tests/test_rtunnel_binary.py
          tests/test_agent_ops_job_ops.py tests/test_agent_ops_pick_zone.py

      - name: Build package
        if: runner.os == 'Linux'
        run: uv build

      - name: Windows CLI output survives a pipe
        if: runner.os == 'Windows'
        env:
          INSPIRE_SKIP_UPDATE_CHECK: "1"
        run: |
          uv run inspire --version
          uv run inspire --help > help.txt
          uv run inspire notebook --help > notebook-help.txt

      - name: PowerShell installer parses
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: .
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install.ps1), [ref]$null, [ref]$errors) | Out-Null
          if ($errors) {
            $errors | ForEach-Object { Write-Host $_.Message }
            exit 1
          }
